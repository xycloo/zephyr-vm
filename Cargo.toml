[workspace]
resolver = "2"
members = [
    "rs-zephyr-env",
    "macros",
    #"wasm-tests/db-write-read",
    #"wasm-tests/db-write-update-read"
    #, "wasm-tests/soroban-host",
    "ledger-meta-factory", "executor", "actor/server", "actor/sync",
]
exclude = ["actor/example"]

[workspace.dependencies]
zephyr-vm = {path="./rs-zephyr-env"}
tokio = {version="1", features=["full"]}
serde = {version="1.0.218", features=["derive"]}
anyhow = "1.0.75"
hex = "0.4.3"
bincode = "1.0"
reqwest = { version = "0.11.27", features = ["json"]}
serde_json = { version = "1.0" }
sha2 = "0.10.8"
stellar-strkey = "0.0.8"
executor = {path="./executor"}

[workspace.dependencies.stellar-xdr]
version = "=26.0.0"
features=["next", "curr", "serde", "base64"]


[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
